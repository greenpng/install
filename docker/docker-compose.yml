# green-v6 数据/缓存服务 (仅数据层 — gv6 本体由 install.sh 安装)
#
#   postgres: 4 个业务库 (greenv6 / gv6_biz / gv6_admin / gv6_assoc)
#   redis:    soft store / 多 worker 共享 L2 / R100 模板 (可选)
#
# 用法:
#   cd docker && cp .env.example .env  # 或由 install.sh --with-docker 自动生成随机密码
#   docker compose up -d
#
# 端口默认仅回环监听 (127.0.0.1), 可通过 POSTGRES_PORT / REDIS_PORT 覆盖
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gv6
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: greenv6
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gv6_pg:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gv6 -d greenv6"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - gv6_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  gv6_pg:
  gv6_redis:
